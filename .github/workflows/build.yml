name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            out_dir: x64\Release
          - arch: Win32
            out_dir: Win32\Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg integrate install
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV

      - name: Build
        # 如果有 .sln 建议优先编译 .sln
        run: msbuild WindowsProject1.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.arch }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "${{ matrix.out_dir }}\WindowsProject1.exe" "release\WindowsProject1-${{ matrix.arch }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-web-server-${{ matrix.arch }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create ZIPs
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts\tiny-web-server-x64\* -DestinationPath tiny-web-server-${{ github.ref_name }}-win64.zip
          Compress-Archive -Path artifacts\tiny-web-server-Win32\* -DestinationPath tiny-web-server-${{ github.ref_name }}-win32.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}